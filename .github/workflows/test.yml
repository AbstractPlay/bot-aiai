name: Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Resolve AiAi layer stage
        run: |
          STAGE=dev
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            STAGE=prod
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            STAGE=prod
          fi
          echo "AIAI_LAYER_STAGE=$STAGE" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pin npm
        run: npm install -g npm@11.6.2

      - name: Create .npmrc
        run: echo "@abstractplay:registry=https://npm.pkg.github.com/" > .npmrc
      - run: echo "//npm.pkg.github.com/:_authToken=${{secrets.PAT_READ_PACKAGES}}" >> .npmrc

      - name: Reject merge conflict markers in dep files
        run: |
          if grep -r '^<<<<<<<' package.json package-lock.json ci-deps.dev.json ci-deps.prod.json 2>/dev/null; then
            echo "Conflict markers found in dependency files"
            exit 1
          fi

      - name: Install NPM dependencies
        run: npm ci

      - name: Validate ci-deps manifests
        run: npx ap-check-ci-deps

      - name: Install pinned AP dependencies
        run: npx ap-install-deps --stage dev

      - name: Verify lockfile matches ci-deps
        run: npx ap-check-ci-deps --stage dev --strict

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: us-east-1

      - name: Fetch aiai.jar from Lambda layer
        run: npm run fetch-aiai-engine -- --stage "$AIAI_LAYER_STAGE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Lint
        run: npm run lint

      - name: Test (including live AiAi jar)
        env:
          BOT_SUBMIT_DISABLED: '1'
        run: npm test
