name: Test

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-layer-stage:
    runs-on: ubuntu-latest
    outputs:
      aiai_layer_stage: ${{ steps.stage.outputs.aiai_layer_stage }}
    steps:
      - id: stage
        run: |
          STAGE=dev
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            STAGE=prod
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            STAGE=prod
          fi
          echo "aiai_layer_stage=$STAGE" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve-layer-stage
    uses: ./.github/workflows/ci-test.yml
    with:
      ap_deps_stage: dev
      aiai_layer_stage: ${{ needs.resolve-layer-stage.outputs.aiai_layer_stage }}
    secrets:
      PAT_READ_PACKAGES: ${{ secrets.PAT_READ_PACKAGES }}
      AWS_KEY: ${{ secrets.AWS_KEY }}
      AWS_SECRET: ${{ secrets.AWS_SECRET }}
